# Supabase CLI config — DeskcommCRM
# Docs: https://supabase.com/docs/guides/cli/config
# Este arquivo é versionado. Segredos vivem em .env.local / Vercel.

project_id = "deskcomm-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3001/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Fork G-Compass: cadastro fechado, a equipe entra por convite (auditoria de
# 30/10/2026, P2). Para reabrir no local: true aqui e CADASTRO_ABERTO=true no app.
enable_signup = false

# Tetos por IP a cada 5 min. Em produção (Supabase Cloud) valem os do painel
# Auth > Rate Limits; no kit self-host, GOTRUE_RATE_LIMIT_HEADER=X-Forwarded-For
# é obrigatório, senão o GoTrue não conta nada (P1).
[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
email_sent = 30

[auth.email]
# Atenção: este aqui liga o PROVEDOR de e-mail (login com senha). Com false,
# ninguém entra. Quem fecha o cadastro é o [auth] enable_signup acima.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Templates apontam para /auth/confirm (fluxo token_hash do @supabase/ssr).
# Self-host GoTrue: ver docs/deploy-selfhost (GOTRUE_MAILER_TEMPLATES_*).
# Fork G-Compass: modelos da OPA em supabase/templates/opa/, gerados por
# scripts/gerar-modelos-email-opa.ts (assuntos iguais aos de lá). Os avisos de
# segurança (e-mail trocado, segundo fator) ficam só no painel do projeto em
# produção: docs/EMAILS-OPA.md. Os modelos genéricos continuam em
# supabase/templates/ para outras instalações.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no CRM da OPA"
content_path = "./supabase/templates/opa/confirmation.html"

[auth.email.template.recovery]
subject = "Crie uma senha nova para o CRM da OPA"
content_path = "./supabase/templates/opa/recovery.html"

[auth.email.template.invite]
subject = "Você foi convidado para o CRM da OPA"
content_path = "./supabase/templates/opa/invite.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao CRM da OPA"
content_path = "./supabase/templates/opa/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail no CRM da OPA"
content_path = "./supabase/templates/opa/email_change.html"

[auth.email.template.reauthentication]
subject = "Seu código de confirmação do CRM da OPA"
content_path = "./supabase/templates/opa/reauthentication.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false # Não usamos Edge Functions no MVP
policy = "oneshot"

[analytics]
enabled = false
